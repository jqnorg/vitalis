<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>vitalis · aviso</title>
<style>
  @font-face{font-family:"Geist";src:url(fonts/geist.woff2) format("woff2");font-weight:100 900}
  :root{color-scheme:light;--bg:#f6f7f8;--panel:#fff;--fg:#0f1720;--dim:#6b7684;--line:#dde2e7;--soft:#eef0f3;--pri:#6d4ff0;--pri-h:#5a3fd6}
  @media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#0d1114;--panel:#151a1f;--fg:#eef1f4;--dim:#94a0ad;--line:#262d35;--soft:#1c232a;--pri:#a78bfa;--pri-h:#b9a3ff}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 "Geist",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  main{padding:12px;display:flex;flex-direction:column;gap:10px}
  .card{--c:#e11d48;--cb:#f43f5e;background:var(--panel);border:1.5px solid var(--line);border-top:5px solid var(--cb);border-radius:18px;padding:12px 14px 13px}
  .card.urg{--c:#e11d48;--cb:#f43f5e}.card.imp{--c:#c2410c;--cb:#f59e0b}.card.info{--c:#2563eb;--cb:#3b82f6}
  @media (prefers-color-scheme:dark){.card.urg{--c:#ff6a7c}.card.imp{--c:#f0a23a}.card.info{--c:#6ea4ff}}
  .h{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .mk{width:20px;height:20px}
  .tag{font-weight:700;font-size:14.5px;letter-spacing:-.035em}
  .t{display:flex;align-items:center;gap:5px;color:var(--c);font-weight:600;font-size:12.5px}
  .t svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}
  .id{font-size:22px;font-weight:650;letter-spacing:-.03em;line-height:1.2;word-break:break-word}
  .kw{margin:3px 0 1px}.kw:empty{display:none}
  .m{color:var(--dim);font-size:12.5px}
  .b{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
  button{font:inherit;font-size:12.5px;font-weight:700;color:var(--fg);background:var(--panel);border:1.5px solid var(--line);border-radius:10px;padding:6px 12px;cursor:pointer}
  button:hover{border-color:var(--dim)}
  button.p{background:var(--pri);border-color:var(--pri);color:#fff}
  button.p:hover{background:var(--pri-h);border-color:var(--pri-h)}
  button:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
</style>
</head>
<body><main id="list"></main><script src="alarm.js"></script></body>
</html>
