<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<style>
  body{margin:0;width:330px;background:#f1f4ef;color:#15201a;font:13px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{display:flex;align-items:center;gap:8px;padding:12px 14px 6px}
  header img{width:28px;height:28px}
  header b{font-weight:800;font-size:20px;letter-spacing:-.04em}
  header span{flex:1;text-align:right;color:#5b685f;font-size:12px}
  main{padding:4px 14px 10px}
  .st{margin-bottom:8px}
  .dim{color:#5b685f}.hot{color:#b0620a;font-weight:700}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:6px 0 10px}
  .stats div{background:#fff;border:1px solid #dfe5dc;border-radius:12px;padding:6px 8px}
  .stats b{display:block;font-size:18px;font-weight:800}
  .stats small{color:#5b685f;font-size:11.5px}
  h4{margin:8px 0 6px;font-size:12.5px;color:#5b685f}
  ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
  li{display:grid;grid-template-columns:auto auto 1fr;gap:8px;padding:6px 9px;background:#fff;border:1px solid #dfe5dc;border-radius:10px}
  li .t{font-variant-numeric:tabular-nums;font-weight:600;font-size:12.5px}
  li .i{font-weight:800}
  li .k{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#5b685f}
  .ok{color:#1b874a;font-weight:700}.bad{color:#cf3049;font-weight:700}
  #res{background:#fff;border:1px solid #dfe5dc;border-radius:10px;padding:7px 9px}
  .empty{color:#5b685f;padding:8px 0;text-align:center}
  footer{display:flex;gap:6px;padding:10px 14px 14px}
  button{font:inherit;font-size:12.5px;font-weight:700;color:#15201a;background:#fff;border:1px solid #dfe5dc;border-radius:999px;padding:6px 12px;cursor:pointer}
  button:hover{border-color:#5b685f}
  button.p{background:#1b874a;border-color:#1b874a;color:#fff}
</style>
</head>
<body>
<header><img src="icons/48.png" alt=""><b>vitalis</b><span id="who"></span></header>
<main><div class="st" id="watch" hidden></div><div class="st dim" id="st"></div><div class="stats" id="stats"></div><div class="st" id="res" hidden></div><h4>Agenda</h4><ul id="list"></ul></main>
<footer><button id="open" type="button" class="p">Abrir Vitalis</button><button id="test" type="button">Probar aviso</button></footer>
<div id="crmBox" hidden style="padding:0 14px 14px"><details><summary style="cursor:pointer;color:#5b685f;font-size:12.5px">¿Esta página es un CRM? Usar Vitalis acá</summary>
<div style="display:flex;gap:6px;margin-top:8px"><select id="crmBrand" style="flex:1;font:inherit;font-size:12.5px;border:1px solid #dfe5dc;border-radius:999px;padding:5px 8px"><option>Trade24Seven</option><option>Novara Markets</option></select><button id="crmAdd" type="button">Usar acá</button></div>
<div class="dim" id="crmRes" style="font-size:12px;margin-top:6px"></div></details></div>
<script src="popup.js"></script>
</body>
</html>
