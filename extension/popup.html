<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<style>
  @font-face{font-family:"Plus Jakarta Sans";src:url(fonts/pjs.woff2) format("woff2-variations");font-weight:200 800}
  @font-face{font-family:"Plus Jakarta Sans";src:url(fonts/pjs-ext.woff2) format("woff2-variations");font-weight:200 800;unicode-range:U+0100-02BA}
  @font-face{font-family:"Geist Mono";src:url(fonts/geistmono.woff2) format("woff2-variations");font-weight:100 900}
  :root{color-scheme:light;--bg:#f6f7f8;--panel:#fff;--fg:#0f1720;--dim:#6b7684;--line:#dde2e7;--soft:#eef0f3;--pri:#6d4ff0;--pri-h:#5a3fd6;--pri-soft:#efeafe;--acc:#c2410c;--err:#e11d48;--v-ok:#00b36b}
  @media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#0d1114;--panel:#151a1f;--fg:#eef1f4;--dim:#94a0ad;--line:#262d35;--soft:#1c232a;--pri:#a78bfa;--pri-h:#b9a3ff;--pri-soft:#261f40;--acc:#f0a23a;--err:#ff6a7c}}
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  body{margin:0;width:340px;background:var(--bg);color:var(--fg);font:13px/1.5 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  header{display:flex;align-items:center;gap:9px;padding:14px 16px 8px}
  header img{width:26px;height:26px}
  header b{font-weight:700;font-size:19px;letter-spacing:-.035em}
  header span{flex:1;text-align:right;color:var(--dim);font-size:12px}
  main{padding:2px 16px 8px}
  .st{margin-bottom:10px}
  .dim{color:var(--dim)}.hot{color:var(--acc);font-weight:600}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 12px}
  .stats div{background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:8px 10px}
  .stats b{display:block;font-size:19px;font-weight:650;letter-spacing:-.03em}
  .stats small{color:var(--dim);font-size:11.5px}
  h4{margin:6px 0 6px;font-size:12px;font-weight:500;color:var(--dim)}
  ul{list-style:none;margin:0;padding:0;background:var(--panel);border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
  li{display:grid;grid-template-columns:auto auto 1fr;gap:10px;padding:8px 11px}
  li+li{border-top:1px solid var(--soft)}
  li .t{font-variant-numeric:tabular-nums;font-weight:500;font-size:12.5px;color:var(--dim)}
  li .t.hot{color:var(--acc)}
  li .i{font-weight:650}
  li .k{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--dim)}
  ul:empty{display:none}
  .ok{color:var(--pri);font-weight:600}.bad{color:var(--err);font-weight:600}
  .box{background:var(--panel);border:1.5px solid var(--line);border-top:4px solid var(--v-ok);border-radius:12px;padding:9px 11px}
  .box .row{display:flex;align-items:center;gap:8px}
  .box .row span{flex:1}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--v-ok);margin-right:7px;vertical-align:1px}
  .dot.off{background:var(--line)}.dot.bad{background:var(--err)}
  .empty{color:var(--dim);padding:6px 0;text-align:center}
  footer{display:flex;gap:8px;padding:10px 16px 16px}
  button{font:inherit;font-size:12.5px;font-weight:700;color:var(--fg);background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:7px 13px;cursor:pointer}
  button:hover{border-color:var(--dim)}
  button.p{background:var(--pri);border-color:var(--pri);color:#fff}
  button.p:hover{background:var(--pri-h);border-color:var(--pri-h)}
  button.sm{padding:4px 10px;font-size:12px;border-radius:10px}
  button:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
  select{font:inherit;font-size:12.5px;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 8px}
  details summary{cursor:pointer;color:var(--dim);font-size:12.5px}
  /* modo prueba */
  #trial{padding:2px 16px 14px}
  #trial label{display:block;font-size:12px;font-weight:600;color:var(--dim);margin:10px 0 4px}
  #trial input{font:inherit;font-size:14px;width:100%;color:var(--fg);background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:9px 11px}
  #trial input:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 2px #6d4ff033}
  #trial input.code{font-size:20px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;text-align:center}
  #trial .go{width:100%;margin-top:12px;padding:10px}
  #trial .msg{margin-top:8px;font-size:12.5px;font-weight:600}.msg.err{color:var(--err)}.msg.ok{color:var(--pri)}
  #trial h3{margin:12px 0 6px;font-size:13px;font-weight:700}
  #trial .me{display:flex;align-items:center;gap:8px;margin-bottom:4px}#trial .me span{flex:1}#trial .me b{font-size:14px}
  #trial table{width:100%;border-collapse:collapse;background:var(--panel);border:1.5px solid var(--line);border-radius:12px;overflow:hidden;font-size:12.5px}
  #trial th,#trial td{padding:6px 8px;text-align:left;border-top:1px solid var(--soft)}#trial th{color:var(--dim);font-weight:600;font-size:11.5px;border-top:0}
  #trial td.n,#trial th.n{text-align:right;font-variant-numeric:tabular-nums}#trial td.hot{color:var(--err);font-weight:700}#trial td.i{font-weight:650}
  #trial .lead{font-size:12.5px;color:var(--dim);margin:2px 0 8px}#trial .big{font-size:26px;font-weight:650;letter-spacing:-.03em;line-height:1.1}
  #trial .out{all:unset;cursor:pointer;color:var(--dim);font-size:12px;text-decoration:underline}
</style>
</head>
<body>
<header><img src="icons/48.png" alt=""><b>vitalis</b><span id="who"></span></header>
<div id="trial" hidden></div>
<main id="main"><div class="st box" id="watch" hidden></div><div class="st box" id="station" hidden><div class="row"><span id="stTxt"></span><button id="stOff" type="button" class="sm">Apagar</button></div></div><div class="st dim" id="st"></div><div class="stats" id="stats"></div><div class="st box" id="res" hidden></div><h4>Agenda</h4><ul id="list"></ul></main>
<footer><button id="open" type="button" class="p">Abrir Vitalis</button><button id="test" type="button">Probar aviso</button></footer>
<div id="crmBox" hidden style="padding:0 16px 16px"><details><summary>¿Esta página es un CRM? Usar Vitalis acá</summary>
<div style="display:flex;gap:8px;margin-top:8px"><select id="crmBrand" style="flex:1"><option>Trade24Seven</option><option>Novara Markets</option></select><button id="crmAdd" type="button">Usar acá</button></div>
<div class="dim" id="crmRes" style="font-size:12px;margin-top:6px"></div></details></div>
<script src="popup.js"></script>
</body>
</html>
